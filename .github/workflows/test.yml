name: Private Payment CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Fazer checkout do repositório
        uses: actions/checkout@v4
      
      - name: Definir versão do Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20.x"

      - name: Instalar dependências e executar testes
        run: npm install
          
      - name: Iniciar a API
        run: npm test & 

      - name: Aguardar a API Iniciar 
        run: sleep 10

      - name: Executar testes
        run: npm test